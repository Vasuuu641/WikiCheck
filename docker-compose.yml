services:
  db:
    image: mariadb:lts          # vector search needs 11.7+; lts was 12.3.x in Oct 2026
    ports:
      - "${DB_PORT:-3307}:3306" # 3307 so it does not clash with a local MariaDB
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wikirag}
      MARIADB_USER: ${DB_USER:-wikirag}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wikirag}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
