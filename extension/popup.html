<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aikakone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">Aikakone</span>
      <span class="subtitle">Wikipedia editor companion</span>
    </div>
    <button id="refreshBtn" class="icon-btn" title="Re-analyze this article" hidden>↻</button>
  </header>

  <form id="searchForm" class="search-bar">
    <input id="searchInput" type="text" placeholder="Search any topic, claim, or article…">
    <button type="submit">Search</button>
  </form>

  <nav class="modes" id="modes">
    <button class="mode active" data-mode="check" title="Conflicts and missing content across languages">Check</button>
    <button class="mode" data-mode="ask" title="Ask Wikipedia, with citations and time travel">Ask</button>
    <button class="mode" data-mode="drift" title="How this article's position changed over the years">Drift</button>
  </nav>

  <main id="content">
    <div class="state">Loading…</div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
