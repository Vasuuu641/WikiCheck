<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aikakone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="masthead">
      <span class="wordmark">Aikakone</span>
      <button id="refreshBtn" class="quiet-btn" title="Compare this article with its other language editions again" hidden>Check again</button>
    </div>
    <h1 id="pageTitle" class="page-title">Wikipedia, checked across languages and time</h1>
    <nav class="modes" id="modes" aria-label="Tools">
      <button class="mode active" data-mode="check" title="Conflicts and missing content across language editions">Check</button>
      <button class="mode" data-mode="ask" title="Ask Wikipedia, with citations, today or as of a past date">Ask</button>
      <button class="mode" data-mode="drift" title="How this article's position changed over the years, edit by edit">Drift</button>
    </nav>
  </header>

  <main>
    <form id="searchForm" class="field-row search-bar">
      <input id="searchInput" type="text" placeholder="Find conflicts about a topic or an article" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <div id="content">
      <div class="state">Loading…</div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
